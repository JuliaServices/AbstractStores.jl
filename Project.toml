name = "AbstractStores"
uuid = "b8592f88-5fd7-4e10-8c52-04e8e19aea3c"
authors = ["Jacob Quinn <quinn.jacobd@gmail.com>"]
version = "0.1.1"

[deps]
Base64 = "2a0f44e3-6c83-55bd-87e4-b1978d98bd5f"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
Serialization = "9e88b42a-f829-5b0c-bbe9-9e923198166b"

# The Redis backend (ext/AbstractStoresRedisExt.jl) is deliberately NOT
# declared here yet: it targets JuliaServices/Redis.jl, which is not registered
# in General, and a registered package cannot reference an unregistered weakdep
# (Registrator rejects it as `dependency_not_found`). The extension entry —
# `Redis = "ea172dcb-e524-4936-bdf0-c2e0946dc87a"` plus
# `AbstractStoresRedisExt = "Redis"` — returns the moment Redis.jl is
# registered; until then test/backends.jl loads the extension file directly.
[weakdeps]
CloudStore = "3365d9ee-d53b-4a56-812d-5344d5b716d7"
DBInterface = "a10d1c49-ce27-4219-8d33-6db1a4562965"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[extensions]
AbstractStoresCloudStoreExt = "CloudStore"
AbstractStoresDBInterfaceExt = "DBInterface"
AbstractStoresJSONExt = "JSON"
AbstractStoresTestExt = "Test"

[compat]
Base64 = "1"
CloudStore = "1.6"
DBInterface = "2.5"
Dates = "1"
Harbor = "1"
JSON = "1"
MySQL = "1.5"
SQLite = "1.7"
Serialization = "1"
Test = "1"
julia = "1.10"

# Only registry-resolvable packages belong here, so `Pkg.test` works for anyone.
# The Postgres, Redis, and object-storage backends need packages that are not in
# General yet (JuliaServices/Postgres.jl, JuliaServices/Redis.jl, and CloudBase's
# HTTP 2.x); test/backends.jl loads those opportunistically and skips loudly when
# they are absent. See README "Running the tests" for the full-coverage recipe.
[extras]
DBInterface = "a10d1c49-ce27-4219-8d33-6db1a4562965"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
Harbor = "af79dbb9-1a80-47ad-8928-192a4af69376"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
MySQL = "39abe10b-433b-5dbd-92d4-e302a9df00cd"
SQLite = "0aa819cd-b072-5ff4-a722-6bc24af294d9"
Sockets = "6462fe0b-24de-5631-8697-dd941f90decc"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["DBInterface", "Dates", "Harbor", "JSON", "MySQL", "SQLite", "Sockets", "Test"]
